name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

# Third-party actions are pinned to full commit SHAs so a moved tag cannot
# change the code CI runs. The comment on each line records the release.
# To upgrade, resolve the new tag to its commit SHA and update both.

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the Node version configured for the Vercel project.
          node-version: 24
          cache: npm

      - name: Report runner and Node versions
        run: |
          cat /etc/os-release
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch server action scan base
        env:
          ACTION_SCAN_BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "+refs/heads/${ACTION_SCAN_BASE}:refs/remotes/origin/${ACTION_SCAN_BASE}"

      - name: Server action guard scan
        run: npm run actions:guard -- --base "origin/${GITHUB_BASE_REF:-main}"

      - name: Verify committed dependency lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: npm run build

      - name: Administrator typecheck
        run: npm run typecheck:admin

      - name: Administrator production build
        run: npm run build:admin

      - name: Verify application boundary
        run: npm run boundaries -- --require-manifests

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Report runner and database tool versions
        run: |
          cat /etc/os-release
          node --version
          npm --version
          docker --version
          psql --version
          supabase --version

      # A throwaway local stack on the runner: every migration is applied from
      # scratch, then seed.sql. Nothing here can reach the hosted project.
      - name: Start local Supabase
        run: supabase start

      - name: Contract tests (pgTAP)
        run: supabase test db

      - name: Database fixtures
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        # On failure, each psql error becomes an annotation so failing fixtures
        # show on the PR page without opening the full log.
        run: |
          set -o pipefail
          if ! ./tests/database/run.sh 2>&1 | tee "$RUNNER_TEMP/database-fixtures.log"; then
            grep -E '^psql:.*ERROR' "$RUNNER_TEMP/database-fixtures.log" | while IFS= read -r line; do
              echo "::error title=Database fixture error::${line:0:900}"
            done
            echo "::error title=Database fixtures failed::$(grep '^FAILED' "$RUNNER_TEMP/database-fixtures.log")"
            exit 1
          fi

      - name: Load optional synthetic demo
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --no-psqlrc --set ON_ERROR_STOP=1 --file supabase/demo.sql

      - name: Demo sign-in and access smoke test
        run: node tests/integration/demo.mjs

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  browser-e2e:
    name: Browser workflows
    runs-on: ubuntu-latest
    needs: database
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Report runner and browser tool versions
        run: |
          cat /etc/os-release
          node --version
          npm --version
          docker --version
          psql --version
          supabase --version
          npx playwright --version

      - name: Start fresh local Supabase
        env:
          SUPABASE_TELEMETRY_DISABLED: 1
        run: supabase start

      - name: Serve local Edge Functions
        env:
          SUPABASE_TELEMETRY_DISABLED: 1
        run: |
          nohup supabase functions serve > "$RUNNER_TEMP/supabase-functions.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/supabase-functions.pid"

      - name: Wait for the delete-account function worker
        env:
          SUPABASE_TELEMETRY_DISABLED: 1
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const status = JSON.parse(execFileSync('supabase', ['status', '--output', 'json'], { encoding: 'utf8' }));
          const endpoint = new URL('/functions/v1/delete-account', status.API_URL);
          const anonKey = status.ANON_KEY ?? status.PUBLISHABLE_KEY;
          if (typeof anonKey !== 'string' || !anonKey) {
            throw new Error('Supabase status did not provide a local anon or publishable key.');
          }
          let lastStatus = 'no response';
          for (let attempt = 0; attempt < 90; attempt += 1) {
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { apikey: anonKey, 'content-type': 'application/json' },
                body: JSON.stringify({ operation: 'status' }),
              });
              lastStatus = String(response.status);
              const body = await response.json().catch(() => null);
              // This response is produced by delete-account's handler after it
              // parses the request. A gateway JWT rejection alone is not readiness.
              if (response.status === 401 && body?.error === 'unauthorized') process.exit(0);
              if (response.status !== 502 && response.status !== 503) {
                lastStatus += ` (${JSON.stringify(body)})`;
              }
            } catch (error) {
              lastStatus = error instanceof Error ? error.message : String(error);
            }
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          throw new Error(`delete-account worker did not return its handler-level unauthenticated response (last result: ${lastStatus}).`);
          NODE

      - name: Build and run browser workflows
        env:
          E2E_SUPABASE_WORKDIR: .
          E2E_PORT: 3000
          SUPABASE_TELEMETRY_DISABLED: 1
        run: npm run e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: .playwright/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        env:
          SUPABASE_TELEMETRY_DISABLED: 1
        run: supabase stop --no-backup
